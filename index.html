<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Craft Coffee | Панель управления</title>
    <link rel="stylesheet" href="style-2.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <!-- Экран логина -->
    <div id="login-screen" class="login-screen">
        <form id="admin-login-form" class="admin-card">
            <h2>Вход для персонала</h2>
            <input type="email" id="admin-email" placeholder="Email сотрудника" required>
            <div class="password-wrapper">
                <input type="password" id="admin-password" placeholder="Пароль" required>
                <button type="button" class="toggle-password" data-target="admin-password" aria-label="Показать пароль">👁️</button>
            </div>
            <button type="submit" class="btn-primary">Войти в систему</button>
        </form>
    </div>

    <!-- Главный дашборд (скрыт до авторизации) -->
    <div id="dashboard" class="dashboard" style="display: none;">
        <!-- Боковое меню -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <h2>Admin<span>Panel</span></h2>
            </div>
            <nav class="sidebar-nav">
                <button class="nav-btn active" data-target="orders">📦 Заказы</button>
                <button class="nav-btn" data-target="menu">☕ Управление меню</button>
            </nav>
            <div class="sidebar-footer">
                <span id="staff-email" class="staff-email"></span>
                <button id="logout-btn" class="btn-danger">Выйти</button>
            </div>
        </aside>

        <!-- Основной контент -->
        <main class="main-content">
            
            <!-- Секция: Заказы -->
            <section id="orders-section" class="content-section active">
                <div class="section-header">
                    <h1>Актуальные заказы</h1>
                    <button id="refresh-orders" class="btn-secondary">🔄 Обновить</button>
                </div>
                <div class="table-container">
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>ID Заказа</th>
                                <th>Клиент</th>
                                <th>Сумма</th>
                                <th>Статус</th>
                                <th>Действия</th>
                            </tr>
                        </thead>
                        <tbody id="orders-tbody">
                            <!-- Заказы будут здесь -->
                        </tbody>
                    </table>
                </div>
            </section>

            <!-- Секция: Управление меню -->
            <section id="menu-section" class="content-section">
                <div class="section-header">
                    <h1>Наше меню</h1>
                    <button id="add-product-btn" class="btn-primary">+ Добавить товар</button>
                </div>
                <div class="table-container">
                    <table class="data-table">
                        <thead>
                            <tr>
                                <th>Фото</th>
                                <th>Название</th>
                                <th>Категория</th>
                                <th>Цена</th>
                                <th>Действия</th>
                            </tr>
                        </thead>
                        <tbody id="menu-tbody">
                            <!-- Товары будут здесь -->
                        </tbody>
                    </table>
                </div>
            </section>
        </main>
    </div>

    <!-- Модальное окно добавления товара -->
    <div id="product-modal" class="modal-overlay">
        <div class="modal-content">
            <h3>Новый товар</h3>
            <form id="add-product-form">
                <input type="text" id="prod-name" placeholder="Название (например, Латте)" required>
                <select id="prod-category" required>
                    <option value="coffee">Кофе</option>
                    <option value="dessert">Десерты</option>
                </select>
                <input type="number" id="prod-price" placeholder="Цена (₸)" required>
                <textarea id="prod-desc" placeholder="Описание товара" required></textarea>
                <input type="url" id="prod-image" placeholder="URL картинки (с Unsplash или др.)" required>
                <div class="modal-actions">
                    <button type="button" id="close-modal-btn" class="btn-secondary">Отмена</button>
                    <button type="submit" class="btn-primary">Сохранить</button>
                </div>
            </form>
        </div>
    </div>

    <script type="module" src="app-2.js"></script>
</body>
